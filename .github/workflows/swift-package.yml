name: Swift package
on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'clients/swift/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'examples/session_records.rs'
      - 'examples/session_follow.rs'
      - 'tests/session_tls.rs'
      - 'src/**'
      - '.github/workflows/swift-package.yml'
  pull_request:
    paths:
      - 'Package.swift'
      - 'clients/swift/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'examples/session_records.rs'
      - 'examples/session_follow.rs'
      - 'tests/session_tls.rs'
      - 'src/**'
      - '.github/workflows/swift-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: SwiftPM tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test
      - name: Headless Swift to Rust Sync Engine over TCP
        run: python3 clients/swift/e2e/run-head.py

  swift-tls-e2e:
    name: Swift to Rust TLS (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version
          if ! brew list --versions openssl@3 >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          fi
          sh clients/swift/e2e/run-tls.sh
