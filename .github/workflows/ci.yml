name: Sync engine CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install supported Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.85.0 --profile minimal
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Test default core and all adapters
        run: |
          cargo +stable test --locked --no-default-features
          cargo +stable test --locked --all-features --all-targets
          cargo +stable test --locked --all-features --doc
      - name: Public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --all-features --no-deps
      - name: Minimum supported Rust
        run: cargo +1.85.0 check --locked --all-targets --all-features
