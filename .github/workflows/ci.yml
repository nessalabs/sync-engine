name: Sync engine CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-${{ github.workflow }}-${{ github.ref }}
  # Keep main's run alive to populate the shared Rust cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Test CI path classification
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Classify changed paths
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "Rust checks run for $EVENT."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub's files endpoint is paginated. Include both sides of a rename.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files?per_page=100" \
            --jq '.[] | {filename, previous_filename, status} | @json' > "$RUNNER_TEMP/pr-files.jsonl"
          if [ "$(python3 scripts/ci/documentation_only.py < "$RUNNER_TEMP/pr-files.jsonl")" = true ]; then
            echo "Markdown-only PR; Rust checks are skipped."
            echo "rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rust checks run."
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install supported Rust toolchains
        if: steps.changes.outputs.rust != 'false'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust != 'false'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        if: steps.changes.outputs.rust != 'false'
        run: cargo +stable fmt --all -- --check
      - name: Lint
        if: steps.changes.outputs.rust != 'false'
        run: cargo +stable clippy --locked --all-features --all-targets -- -D warnings
      - name: Test core, SQLite adapters, examples, and API examples
        if: steps.changes.outputs.rust != 'false'
        run: |
          cargo +stable test --locked --no-default-features --all-targets
          cargo +stable test --locked --no-default-features --features sqlite --all-targets
          cargo +stable test --locked --no-default-features --features transport --all-targets
          cargo +stable test --locked --all-features --all-targets
          cargo +stable test --locked --all-features --doc
      - name: Slice 1 two-device lab
        if: steps.changes.outputs.rust != 'false'
        run: ./scripts/verify-slice-1
      - name: Slice 2 process-restart and rollback lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-slice-2.py
      - name: Slice 3 loopback and fault lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-slice-3.py
      - name: Slice 4 transcript and task apps
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-slice-4.py
      - name: Slice 5 bounded tail and history
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-slice-5.py
      - name: Slice 6 finite catalogue passes
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-slice-6.py
      - name: Slice 7 catalogue over loopback transport
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-slice-7.py
      - name: Generic record server across processes
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-record-server.py
      - name: Artifact manifest and availability example
        if: steps.changes.outputs.rust != 'false'
        run: cargo run --locked --example artifact_contract
      - name: Bounded artifact transfer process lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-artifact-transfer.py
      - name: Machine-readable owner wire contract
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-wire-contract.py
      - name: Bounded session control metadata lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-control.py
      - name: Bounded session binding lifecycle lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-lifecycle.py
      - name: Current-policy session authorization prerequisite lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-authorization.py
      - name: Session record TCP and durable-cache end-to-end foundation
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-e2e.py
      - name: Timed record outage and seed-counter regression
        if: steps.changes.outputs.rust != 'false'
        run: |
          python3 scripts/verify-session-record-outage.py --profiles --jobs 4
          python3 scripts/regression-session-record-outage.py
      - name: Persistent advisory follow TCP and durable-cache lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-follow.py
      - name: Bounded history over the persistent session
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-history.py
      - name: Capability follow single-connection prerequisite
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-follow.py --capability-follow
      - name: Native SourceHead initial compatibility admission
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-source-head.py
      - name: Record capability direct and relay admission
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-capabilities.py
      - name: Durable record-source publication and restart lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-source-publication.py
      - name: Durable catalogue publication and restart lab
        if: steps.changes.outputs.rust != 'false'
        run: |
          python3 scripts/verify-catalogue-publication.py
          python3 scripts/measure-catalogue-retirement.py --repetitions 1
          python3 scripts/measure-catalogue-publication.py --native-repetitions 1
      - name: Explicit catalogue capability operations and restart lab
        if: steps.changes.outputs.rust != 'false'
        run: |
          python3 scripts/verify-catalogue-capabilities.py
          python3 scripts/measure-catalogue-publication.py --client-dialect capabilities --native-repetitions 1
      - name: Deterministic record freshness and native cache-read lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-freshness.py
      - name: Live per-scope freshness policy and replacement-connection lab
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-session-freshness.py
      - name: Native same-scope catalogue reset and restart lab
        if: steps.changes.outputs.rust != 'false'
        run: |
          python3 scripts/verify-catalogue-reset.py
          python3 scripts/verify-catalogue-horizon.py
          python3 scripts/verify-catalogue-horizon-reset.py
          python3 scripts/verify-catalogue-collection.py
          python3 scripts/verify-catalogue-collection.py --profile v2-zero
          python3 scripts/verify-catalogue-collection.py --profile legacy-collected
      - name: Explicit catalogue v2 coverage and mixed-version TCP lab
        if: steps.changes.outputs.rust != 'false'
        run: |
          git fetch --depth=1 origin 8596fd36e922af25fe1da2d2524a6e65673ee25b
          python3 scripts/verify-catalogue-horizon-wire.py
      - name: Set up Java for the pinned finite reset model
        if: steps.changes.outputs.rust != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Finite catalogue reset model and negative controls
        if: steps.changes.outputs.rust != 'false'
        run: |
          curl --fail --location --max-time 60 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
          python3 scripts/verify-catalogue-reset-model.py --jar "$RUNNER_TEMP/tla2tools.jar"
          python3 scripts/verify-catalogue-collection-model.py --jar "$RUNNER_TEMP/tla2tools.jar"
      - name: Finite receiver origin-epoch model and controls
        if: steps.changes.outputs.rust != 'false'
        run: python3 scripts/verify-origin-epoch-model.py --jar "$RUNNER_TEMP/tla2tools.jar"
      - name: Public API documentation
        if: steps.changes.outputs.rust != 'false'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --all-features --no-deps
      - name: Minimum supported Rust
        if: steps.changes.outputs.rust != 'false'
        run: |
          cargo +1.85.0 check --locked --no-default-features --all-targets
          cargo +1.85.0 check --locked --no-default-features --features transport --all-targets
          cargo +1.85.0 check --locked --all-features --all-targets
