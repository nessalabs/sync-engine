[package]
name = "nessa-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Reusable replication for local-first applications"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite"]
transport = ["sqlite"]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"], optional = true }

[[example]]
name = "transcript_sqlite"
required-features = ["sqlite"]

[[example]]
name = "loopback_sync"
required-features = ["transport"]

[[example]]
name = "local_apps"
required-features = ["transport"]

[workspace]
